<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Clean</title>
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="logo">
        <img class="logo-icon" src="../icons/icon48.png" alt="" />
        <span class="logo-text">Quick<span>Clean</span></span>
      </div>
      <div class="header-actions">
        <button class="btn-options" id="btnTheme" data-i18n-title="themeToggle">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
          </svg>
        </button>
        <button class="btn-options" id="btnOptions" data-i18n-title="settingsTitle">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="time-section">
      <label class="section-label" data-i18n="period">Period</label>
      <div class="time-pills">
        <button class="pill active" data-value="hour" data-i18n="range1h">1 hour</button>
        <button class="pill" data-value="day" data-i18n="range24h">24 h</button>
        <button class="pill" data-value="week" data-i18n="range7d">7 days</button>
        <button class="pill" data-value="all" data-i18n="rangeAll">All</button>
      </div>
    </section>

    <section class="options-section">
      <label class="section-label" data-i18n="dataToClear">Data to clear</label>
      <div class="toggle-list">

        <label class="toggle-item">
          <div class="toggle-info">
            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/><path d="M12 8v4l3 3"/></svg>
            <span data-i18n="optHistory">History</span>
          </div>
          <input type="checkbox" id="clearHistory" /><span class="slider"></span>
        </label>

        <label class="toggle-item">
          <div class="toggle-info">
            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/><path d="M8.5 8.5v.01M16 15.5v.01M12 12v.01M11 17v.01M7 14v.01"/></svg>
            <span data-i18n="optCookies">Cookies</span>
          </div>
          <input type="checkbox" id="clearCookies" /><span class="slider"></span>
        </label>

        <label class="toggle-item">
          <div class="toggle-info">
            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            <span data-i18n="optCache">Cache</span>
          </div>
          <input type="checkbox" id="clearCache" /><span class="slider"></span>
        </label>

        <label class="toggle-item">
          <div class="toggle-info">
            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span data-i18n="optDownloads">Downloads</span>
          </div>
          <input type="checkbox" id="clearDownloads" /><span class="slider"></span>
        </label>

        <label class="toggle-item">
          <div class="toggle-info">
            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span data-i18n="optForms">Forms</span>
          </div>
          <input type="checkbox" id="clearFormData" /><span class="slider"></span>
        </label>

        <label class="toggle-item">
          <div class="toggle-info">
            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span data-i18n="optPasswords">Passwords</span>
          </div>
          <input type="checkbox" id="clearPasswords" /><span class="slider"></span>
        </label>

        <label class="toggle-item">
          <div class="toggle-info">
            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
            <span data-i18n="optLocalStorage">Local storage</span>
          </div>
          <input type="checkbox" id="clearLocalStorage" /><span class="slider"></span>
        </label>

        <label class="toggle-item">
          <div class="toggle-info">
            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <span data-i18n="optCloseTabs">Close tabs</span>
          </div>
          <input type="checkbox" id="closeTabs" /><span class="slider"></span>
        </label>

      </div>
    </section>

    <div class="action-area">
      <button class="btn-clean" id="btnClean">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4h6v2"/>
        </svg>
        <span id="btnText" data-i18n="btnClean">Clean now</span>
      </button>
    </div>

    <section class="site-card" id="siteCard">
      <div class="site-info">
        <span class="site-label" data-i18n="thisSite">This site</span>
        <span class="site-host" id="siteHost"></span>
      </div>
      <button class="btn-site" id="btnSite" data-i18n="btnCleanSite" hidden>Clean site</button>
      <span class="site-unavailable" id="siteUnavailable" data-i18n="siteUnavailable" hidden>Open a website to clean it on its own.</span>
    </section>

    <div class="status-bar" id="statusBar" hidden>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="statusText"></span>
    </div>

    <section class="stats">
      <div class="stat"><strong id="statCleanups">0</strong><span data-i18n="statsCleanups">Cleanups</span></div>
      <div class="stat"><strong id="statSites">0</strong><span data-i18n="statsSites">Sites</span></div>
      <div class="stat"><strong id="statHistory">0</strong><span data-i18n="statsHistory">History</span></div>
    </section>

    <div class="footer">
      <p class="last-clean" id="lastClean"></p>
      <kbd data-i18n-title="shortcutLabel" title="Shortcut:">Ctrl+Shift+E</kbd>
    </div>

  </div>
  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
